version: '3'

# The rig (crates/facerig, package game-toolkit-facerig) depends on a sibling game-toolkit
# checkout at ../game-toolkit until `Graphics::update_mesh` is released; see Cargo.toml.

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  toolchain:
    internal: true
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
      - sh: test -f ../game-toolkit/crates/prelude/Cargo.toml
        msg: "game-toolkit not found at ../game-toolkit — clone it next to this repository (branch with Graphics::update_mesh)"

  build:
    desc: Build the crate, tests and the viewer example
    deps: [toolchain]
    cmds:
      - cargo build --all-targets

  run:
    desc: 'Run the viewer (release). Args pass through, e.g. task run -- smile --low'
    deps: [toolchain]
    cmds:
      - cargo run --release --example viewer -- {{.CLI_ARGS}}

  shot:
    desc: 'Save a screenshot of a preset to shots/ (PRESET=smile YAW=0.6)'
    deps: [toolchain]
    vars:
      PRESET: '{{ .PRESET | default "neutral" }}'
      YAW: '{{ .YAW | default "0" }}'
      OUT: '{{.ROOT_DIR}}/shots/{{.PRESET}}_{{.YAW}}.png'
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/shots"
      - cargo run --release --example viewer -- {{.PRESET}} --yaw {{.YAW}} --shot "{{.OUT}}"
      - echo "wrote {{.OUT}}"

  test:
    desc: Run unit and doc tests. Args pass through to cargo test
    deps: [toolchain]
    cmds:
      - cargo test {{.CLI_ARGS}}

  fmt:
    desc: Format the workspace
    aliases: [format]
    deps: [toolchain]
    cmds:
      - cargo fmt --all

  lint:
    desc: Clippy (-D warnings) with default and no default features, plus wasm32 when installed
    deps: [toolchain]
    cmds:
      - cargo clippy --all-targets -- -D warnings
      - cargo clippy -p game-toolkit-facerig --no-default-features --all-targets -- -D warnings
      - |
        if rustup target list --installed 2>/dev/null | grep -qx wasm32-unknown-unknown; then
          cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
        else
          echo "wasm32-unknown-unknown not installed; skipping wasm clippy"
        fi

  lint:fix:
    desc: Apply clippy fixes, then format
    aliases: [fix]
    deps: [toolchain]
    cmds:
      - cargo clippy --all-targets --fix --allow-dirty --allow-staged
      - task: fmt

  docs:
    desc: Build the crate docs (warnings are errors)
    deps: [toolchain]
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --no-deps

  docs:open:
    desc: Build and open the crate docs
    deps: [toolchain]
    cmds:
      - cargo doc --no-deps --open

  check:
    desc: fmt check + clippy + docs
    deps: [toolchain]
    cmds:
      - cargo fmt --all --check
      - task: lint
      - task: docs

  ci:
    desc: check, then tests
    cmds:
      - task: check
      - task: test

  clean:
    desc: Remove build output and screenshots
    cmds:
      - cargo clean
      - rm -rf shots
